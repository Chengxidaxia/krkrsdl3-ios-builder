name: Build krkrsdl3 Emscripten (wasm)

# 目的：把 krkrsdl3 **原样**编译成 WebAssembly，用来判定「画面被居中放大/裁切」
# 到底是**引擎问题**还是 **iOS 平台问题**。
#
#   wasm 版也裁  ->  引擎问题（与平台无关）-> 可以在 PC 上迭代，不必反复装机
#   wasm 版正常  ->  iOS 平台问题（SDL3 UIKit 后端）-> 专注 iOS 侧
#
# 刻意**不**应用 build-ios.yml 里的任何补丁：那些补丁都关在 _KRKRSDL3_IOS 里面，
# 这里要的就是上游行为。构建脚本与参数完全照抄上游 script/build-emscripten.bat：
#   cmake --preset "Emscripten Config" -DUSE_FFMPEG=OFF -DUSE_RENDER_VK=OFF
#   cmake --build --preset "Emscripten Release Build"
#
# 与上游 .bat 的差异（都是为了在 Linux runner 上跑通）：
#   1. preset 写死了 Windows 的 emcc.bat / em++.bat -> 用 -D 覆盖成 emcc / em++。
#   2. **vcpkg 必须完整 clone**：vcpkg.json 里的 builtin-baseline 是一个具体
#      commit，`--depth 1` 的浅克隆里没有那个对象，vcpkg 会在
#      `git show <baseline>:versions/baseline.json` 上直接失败（run#1 就是这么挂的）。
#   3. 显式指定 CMAKE_MAKE_PROGRAM 指向 ninja，避免 preset 的
#      "Ninja Multi-Config" 找不到 make program。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-wasm.yml'

permissions:
  contents: write

jobs:
  build-wasm:
    name: emscripten release -> index.html/js/wasm/data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EMSDK: /home/runner/emsdk
      VCPKG_ROOT: /home/runner/vcpkg
      EM_CACHE: /home/runner/emcache
    steps:
      - name: Checkout (workflow repo)
        uses: actions/checkout@v4

      - name: Fetch krkrsdl3_build source
        run: |
          git clone --recursive --shallow-submodules --depth 1 \
            https://github.com/krkrsdl3/krkrsdl3_build.git src
          ls src

      - name: Show build script (upstream truth)
        run: cat src/script/build-emscripten.bat

      - name: Show vcpkg baseline pin
        run: |
          echo "--- vcpkg.json builtin-baseline ---"
          grep -n '"builtin-baseline"' src/vcpkg.json || echo "(no builtin-baseline)"

      # ---- 关键 CI 本地修补：让 Emscripten 分支真的被选中 ----
      #
      # 上游 CMakeLists.txt 的判定顺序是
      #     if(ANDROID) ... elseif(LINUX) ... elseif(EMSCRIPTEN) ...
      # LINUX 排在 EMSCRIPTEN 前面，而 Emscripten preset 并没有把 LINUX 关掉。
      # 在 ubuntu runner 上 LINUX 是真，于是走进 LINUX 分支：
      #     set(VCPKG_TARGET_TRIPLET "x64-linux-release")
      # vcpkg 就按 **宿主机 x64-linux** 解析依赖（run#2 的日志里赫然列出
      # ffmpeg/dbus/wayland/x11 这些只在 Linux 上的包，而且 vcpkg.json 里
      # ffmpeg 明明写了 "platform": "!emscripten"，就是因为平台没被识别成
      # emscripten 才没被排除），然后去编译 ffmpeg 的宿主工具并失败。
      #
      # macOS runner 上跑 iOS 不会碰到这个，因为那时 LINUX 不是真。
      # 只改这一处，别的都不动：
      - name: Pin vcpkg triplet to wasm32-emscripten (upstream branch-order workaround)
        run: |
          set -e
          grep -n 'elseif(LINUX)' src/CMakeLists.txt
          sed -i 's/^elseif(LINUX)/elseif(LINUX AND NOT EMSCRIPTEN)/' src/CMakeLists.txt
          echo '--- after ---'
          sed -n '7,30p' src/CMakeLists.txt

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config zip
          which ninja && ninja --version

      - name: Setup Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install latest
          "$EMSDK/emsdk" activate latest
          source "$EMSDK/emsdk_env.sh"
          emcc --version

      # vcpkg 的 installed/downloads 才是耗时大头（wasm 上要现编 SDL3/freetype/
      # libpng/harfbuzz...）。vcpkg.json 里既有 builtin-baseline 又逐项钉了版本，
      # 所以用它做 key 是安全的。
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/vcpkg/installed
            /home/runner/vcpkg/downloads
          key: vcpkg-wasm-${{ hashFiles('src/vcpkg.json') }}

      - name: Setup vcpkg
        run: |
          # 注意：这里**不能**用 --depth 1，见文件头第 2 条。
          # 另外 GitHub 的 git clone 偶发失败（run#4 就是在这一步挂的），所以重试。
          for i in 1 2 3; do
            rm -rf "$VCPKG_ROOT"
            if git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; then
              break
            fi
            echo "vcpkg clone attempt $i failed, retrying..."
            sleep 5
          done
          test -d "$VCPKG_ROOT/.git" || { echo "vcpkg clone failed after 3 attempts"; exit 1; }
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # ---- r39 对照实验：把引擎报告的桌面尺寸强行改成 812x375 ----
      #
      # 排变量过程：
      #   kag.sc / kag.px / layer  两边完全相同（1920x1080 / 1280x720）-> 排除
      #   System.screenWidth/Height  r38 把它从 1920x1080 改回 1280x720，
      #                             iOS 画面**没变** -> 排除
      #   System.desktopWidth/Height  wasm=1598x657 / iOS=812x375 -> 只剩这个
      #
      # 这个构建把 wasm 的 desktop 尺寸也改成 812x375（= iOS 的值）：
      #   画面跟着变裁 -> desk 就是那个变量
      #   画面不变     -> desk 也不是，得回头重新找
      #
      # 注意 GetDesktopWidth/Height 是 SDL_GetDisplayUsableBounds 的薄封装，
      # 两处 `return rect.w/h;` 就是它们的返回值。
      - name: "Probe: force desktop size to 812x375 (iOS value)"
        run: |
          F=src/cpp/environ/sdl3/sdl3_utils.cpp
          echo '--- occurrences before ---'
          grep -n 'return rect\.[wh];' "$F"
          sed -i 's/^        return rect\.w;$/        return 812;/' "$F"
          sed -i 's/^        return rect\.h;$/        return 375;/' "$F"
          echo '--- after ---'
          grep -n -A 8 'int tTVPScreen::GetDesktopWidth' "$F"
          grep -n -A 8 'int tTVPScreen::GetDesktopHeight' "$F"

      # ---- r39 对照实验：把「引擎画布」强行钉成 1920x1080 ----
      #
      # 已经把尺寸类参数全排除了（screenWidth / desktopWidth / kag.sc /
      # kag.px / primaryLayer.setSize / hdresomode -- 见 patch.tjs 里的记录）。
      # 改 KAG 的 layer 尺寸完全没用，因为 KAG 的 Layer 不是引擎的 TVPWindow：
      # 真正决定画布(=日志里的 spr)的是 TVPWindow 的 LayerWidth/LayerHeight，
      # 而它在 ResetDrawSprite() 里落到 pSprite 上并重建贴图。
      #
      # 这个构建把 LayerWidth/LayerHeight 强制成 1920x1080：
      # 素材本身就是 1080p 的（title.pimg 等界面布局只存在于 data1080.xp3），
      # 如果游戏确实是照 1080p 布局画的，那么画布给到 1080p 就应该完整，
      # 再由引擎把 1920x1080 的画布 contain 进窗口（TVPCalcLetterbox）。
      #
      # 对照：不加这段时 spr=1280x720，画面是 1080p 布局的左上 1:1。
      # ---- 诊断 + 可选画布覆盖：一次构建，两种跑法 ----
      #
      # 目的 1（始终生效，只打日志）：查清「谁把引擎窗口层设成了 1280x720」。
      #   已经用实测排除的：
      #     * -hdresomode=720 作为真实 argv（引擎日志 "Specified option : -hdresomode=720"）
      #       -> 画面逐字节不变
      #     * -window=1920x1080（引擎日志 "Window size: 1920x1080"）-> KAG 的 layer 仍报 1280x720
      #     * TJS 侧改 kag.sc / kag.px / primaryLayer.setSize / System.screenWidth
      #       -> 全部无效
      #   所以现在直接问引擎：ResetDrawSprite / SetPaintBoxSize / SetSize 各被谁以什么值调用。
      #
      # 目的 2（用 ?args=...,-krkrcanvas=WxH 打开）：强制窗口层尺寸。
      #   实测事实：屏幕上看到的是「1920x1080 布局的左上 1280x720，1:1」
      #   （对 MuMu 正常画面做缩放扫描：diff=6.0 zoom=1.50 window=1279x719 @(0,0)；
      #     菜单项位置也逐项吻合 2/3 比例）。若把画布给到 1920x1080 后画面完整，
      #   根因就是「游戏按 1080p 布局、画布只有 720p」；若画面不变，裁剪在游戏内部。
      - name: "Probe: log window-layer size + optional -krkrcanvas=WxH override"
        run: |
          python3 - <<'PY'
          import io

          # ---- 1) TVPSettings.cpp：解析 -krkrcanvas=WxH，定义两个全局量 ----
          p = 'src/cpp/core/utils/TVPSettings.cpp'
          s = io.open(p, encoding='utf-8').read()
          m = 'static void TVPInitProgramArguments(int tvp_argc, char* tvp_argv[])'
          assert m in s, 'TVPInitProgramArguments not found'
          s = s.replace(m, 'int krkrForceCanvasW = 0;\nint krkrForceCanvasH = 0;\n\n' + m, 1)
          hook = '    TVPInitProgramArguments(argc, argv);\n    TVPDumpOptions();\n'
          assert hook in s, 'arg hook not found'
          s = s.replace(hook, hook + '''
    // --- probe: -krkrcanvas=WxH 覆盖引擎窗口层尺寸（默认 0 = 关闭） ---
    {
        tTJSVariant krkrOpt;
        if (TVPGetCommandLine(TJS_N("-krkrcanvas"), &krkrOpt))
        {
            ttstr krkrStr(krkrOpt);
            const tjs_char* krkrP = krkrStr.c_str();
            int krkrW = 0, krkrH = 0;
            while (*krkrP >= '0' && *krkrP <= '9') { krkrW = krkrW * 10 + (*krkrP - '0'); krkrP++; }
            if (*krkrP == 'x' || *krkrP == 'X')
            {
                krkrP++;
                while (*krkrP >= '0' && *krkrP <= '9') { krkrH = krkrH * 10 + (*krkrP - '0'); krkrP++; }
            }
            if (krkrW > 0 && krkrH > 0)
            {
                krkrForceCanvasW = krkrW;
                krkrForceCanvasH = krkrH;
            }
        }
        TVPAddImportantLog(ttstr("[probe] krkrcanvas -> ") + ttstr(krkrForceCanvasW)
            + TJS_N("x") + ttstr(krkrForceCanvasH));
    }
''', 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched', p)

          # ---- 2) TVPWindow.cpp：打日志 + 按需覆盖 ----
          p2 = 'src/cpp/core/main/TVPWindow.cpp'
          t = io.open(p2, encoding='utf-8').read()
          m2 = 'void TVPWindow::ResetDrawSprite()\n{\n'
          assert m2 in t, 'ResetDrawSprite not found'
          t = t.replace(m2, m2 + '''    {
        extern int krkrForceCanvasW;
        extern int krkrForceCanvasH;
        if (krkrForceCanvasW > 0)
        {
            LayerWidth = krkrForceCanvasW;
            LayerHeight = krkrForceCanvasH;
        }
        static int krkrN1 = 0;
        if (krkrN1 < 10)
        {
            krkrN1++;
            TVPAddImportantLog(ttstr("[probe] ResetDrawSprite layer=") + ttstr((int)LayerWidth)
                + TJS_N("x") + ttstr((int)LayerHeight) + TJS_N(" sprite=")
                + ttstr((int)pSprite->width) + TJS_N("x") + ttstr((int)pSprite->height));
        }
    }
''', 1)
          m3 = 'void TVPWindow::SetPaintBoxSize(tjs_int w, tjs_int h)\n{\n'
          assert m3 in t, 'SetPaintBoxSize not found'
          t = t.replace(m3, m3 + '''    {
        static int krkrN2 = 0;
        if (krkrN2 < 10)
        {
            krkrN2++;
            TVPAddImportantLog(ttstr("[probe] SetPaintBoxSize ") + ttstr((int)w) + TJS_N("x") + ttstr((int)h));
        }
    }
''', 1)
          m4 = 'void TVPWindow::SetSize(tjs_int w, tjs_int h)\n{\n'
          assert m4 in t, 'SetSize not found'
          t = t.replace(m4, m4 + '''    {
        static int krkrN3 = 0;
        if (krkrN3 < 10)
        {
            krkrN3++;
            TVPAddImportantLog(ttstr("[probe] SetSize ") + ttstr((int)w) + TJS_N("x") + ttstr((int)h));
        }
    }
''', 1)
          io.open(p2, 'w', encoding='utf-8').write(t)
          print('patched', p2)
          PY
          echo '--- TVPWindow.cpp ---'
          grep -n 'probe' src/cpp/core/main/TVPWindow.cpp | head
          echo '--- TVPSettings.cpp ---'
          grep -n 'krkrForceCanvas\|probe' src/cpp/core/utils/TVPSettings.cpp | head

      - name: Configure
        working-directory: src
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset "Emscripten Config" \
            -DUSE_FFMPEG=OFF -DUSE_RENDER_VK=OFF \
            -DCMAKE_C_COMPILER=emcc -DCMAKE_CXX_COMPILER=em++ \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"

      - name: Show resolved configuration
        working-directory: src
        run: |
          echo "--- CMakeCache: 平台与 triplet ---"
          grep -E '^(CMAKE_TOOLCHAIN_FILE|CMAKE_SYSTEM_NAME|VCPKG_TARGET_TRIPLET|EMSCRIPTEN|LINUX):' \
            out/emscripten/CMakeCache.txt || true
          echo "--- vcpkg 已装的包（应当看不到 ffmpeg / dbus / wayland / x11）---"
          ls out/emscripten/vcpkg_installed 2>/dev/null || true
          find out/emscripten/vcpkg_installed -maxdepth 2 -name 'CONTROL' 2>/dev/null | head -40 || true

      - name: Build (Release)
        working-directory: src
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --build --preset "Emscripten Release Build"

      - name: Collect artifacts
        run: |
          set -e
          OUT=src/out/emscripten/Release
          ls -la "$OUT" || true
          mkdir -p dist
          cp -v "$OUT"/index.html "$OUT"/index.js "$OUT"/index.wasm "$OUT"/index.data dist/
          ls -la dist

      # 失败时把关键日志打出来（CI 日志本身要 admin token 才能通过 API 取，
      # 这里直接打到 stdout，方便快速定位）。
      - name: Diagnostics on failure
        if: failure()
        working-directory: src
        run: |
          echo "=========== CMakeError.log ==========="
          find . -name CMakeError.log -exec tail -80 {} \; 2>/dev/null || true
          echo "=========== vcpkg buildtrees/*/config-*.log (tail) ==========="
          "$VCPKG_ROOT/vcpkg" list 2>/dev/null || true
          find "$VCPKG_ROOT/buildtrees" -name 'config-*.log' -exec sh -c 'echo "--- $1"; tail -40 "$1"' _ {} \; 2>/dev/null | tail -200 || true
          echo "=========== vcpkg install log tail ==========="
          find "$VCPKG_ROOT/buildtrees" -name 'install-*.log' -exec sh -c 'echo "--- $1"; tail -40 "$1"' _ {} \; 2>/dev/null | tail -200 || true

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wasm-build-${{ github.run_number }}
          name: wasm-build-${{ github.run_number }}
          body: |
            krkrsdl3 Emscripten build (upstream, unpatched).
            Run: put the game data next to index.html and open
            index.html?game=data.xp3 via a local http server.
          files: dist/*
