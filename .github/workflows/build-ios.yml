name: Build krkrsdl3 iOS IPA

# 在 GitHub 的 macOS runner 上把 krkrsdl3 编译成 iOS 设备版 .app 并打成未签名 ipa。
# 仓库只存这个工作流；引擎源码运行时从上游 clone，因此不含任何游戏数据。
#
# 关键改动（"打开就玩"）：environ/sdl3/sdl3_app.cpp 的 SDL_AppInit 要求 argc>=2、
# argv[1]=游戏目录，而 iOS 由 UIApplicationMain 启动、没有命令行，原版必然启动失败。
# 这里在编译前给它打一个补丁：iOS 下用 SDL_GetBasePath() 拼出 <bundle>/game 当 argv[1]。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS device build -> ipa
    runs-on: macos-14
    timeout-minutes: 355

    steps:
      - name: Toolchain info
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version | head -1
          git --version
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch krkrsdl3_build source
        run: |
          set -e
          git clone --recursive --shallow-submodules --depth 1 \
            https://github.com/krkrsdl3/krkrsdl3_build.git src
          echo "--- src top ---"
          ls src
          echo "--- submodule cpp ---"
          ls src/cpp | head -20
          ls -la src/CMakePresets.json src/vcpkg.json src/cpp/environ/sdl3/sdl3_app.cpp

      - name: Patch iOS entry (read game from app bundle)
        run: |
          python3 - <<'PYEOF'
          import io
          p = "src/cpp/environ/sdl3/sdl3_app.cpp"
          MARK = "[patched] iOS game dir"
          SIG = "SDL_AppResult SDL_AppInit(void** appstate, int argc, char* argv[])"
          INC_ANCHOR = "#include <SDL3/SDL_main.h>"
          INC_ADD = "#include <SDL3/SDL_filesystem.h>"   # SDL_GetBasePath 在这里
          INJECT = (
              "#if defined(_KRKRSDL3_IOS)\n"
              "    /* patched: iOS has no cmdline; use <bundle>/game as argv[1] */\n"
              "    {\n"
              "        static char s_exe[] = \"krkrsdl3\";\n"
              "        static char s_game[4096];\n"
              "        static char* s_argv[2];\n"
              "        if (s_game[0] == 0)\n"
              "        {\n"
              "            const char* base = SDL_GetBasePath();\n"
              "            if (!base || !base[0]) base = \"./\";\n"
              "            SDL_snprintf(s_game, sizeof(s_game), \"%sgame\", base);\n"
              "        }\n"
              "        s_argv[0] = s_exe;\n"
              "        s_argv[1] = s_game;\n"
              "        argc = 2; argv = s_argv;\n"
              "        SDL_Log(\"[patched] iOS game dir: %s\", s_game);\n"
              "    }\n"
              "#endif\n"
          )
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched")
          else:
              assert INC_ANCHOR in src, "SDL_main.h include not found"
              if INC_ADD not in src:
                  src = src.replace(INC_ANCHOR, INC_ANCHOR + "\n" + INC_ADD, 1)
              i = src.find(SIG)
              assert i >= 0, "SDL_AppInit signature not found"
              j = src.find("{", i)
              assert j >= 0, "opening brace not found"
              io.open(p, "w", encoding="utf-8", newline="").write(
                  src[:j + 1] + "\n" + INJECT + src[j + 1:])
              print("patched:", p)
          PYEOF
          echo "--- verify: includes ---"
          sed -n '1,12p' src/cpp/environ/sdl3/sdl3_app.cpp
          echo "--- verify: injected block ---"
          grep -n -A 4 "SDL_AppResult SDL_AppInit" src/cpp/environ/sdl3/sdl3_app.cpp | head -10

      - name: Patch 7zCrc (disable ARM HW CRC for Apple clang)
        run: |
          python3 - <<'PYEOF'
          import io, re
          p = "src/cpp/plugins/Kirikiroid2/7zip/7zCrc.c"
          MARK = "ARM HW CRC disabled"
          PAT = re.compile(r"#define Z7_CRC_HW_USE(\r?\n)[ \t]*#include <arm_acle\.h>")
          REPL = ('/* patched: Apple clang lacks __target__("crc"); ARM HW CRC disabled */\\1'
                  '        /* #include <arm_acle.h> */')
          src = io.open(p, encoding="utf-8", errors="surrogateescape", newline="").read()
          if MARK in src:
              print("already patched")
          else:
              out, n = PAT.subn(REPL, src)
              assert n == 1, "expected exactly 1 match, got %d" % n
              io.open(p, "w", encoding="utf-8", errors="surrogateescape", newline="").write(out)
              print("patched:", p)
          PYEOF
          echo "--- verify: ARM HW CRC disabled, falls back to table CRC ---"
          grep -n -A 1 "ARM HW CRC disabled" src/cpp/plugins/Kirikiroid2/7zip/7zCrc.c | head -6

      - name: Setup vcpkg
        env:
          VCPKG_DISABLE_METRICS: 1
        run: |
          set -e
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          "$VCPKG_DIR/vcpkg" version

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-bincache
            ${{ runner.temp }}/vcpkg/downloads
          key: vcpkg-ios-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: |
            vcpkg-ios-

      - name: Configure (iOS Device)
        working-directory: src
        run: |
          set -o pipefail   # 关键：防止 | tail 把 cmake 的失败退出码吃掉
          cmake --preset "iOS Device Config" -DUSE_RENDER_VK=OFF 2>&1 | tee /tmp/configure.log | tail -80

      - name: Build (iOS Device Release)
        working-directory: src
        run: |
          set -o pipefail   # 关键：同上
          cmake --build --preset "iOS Device Release Build" --parallel 2>&1 | tee /tmp/build.log | tail -150

      - name: Verify app bundle completeness
        run: |
          APP=$(find src/out -type d -name "krkrsdl3.app" -not -path "*/build/*" | head -1)
          echo "APP=$APP"
          find src/out -maxdepth 4 | head -60
          if [ -z "$APP" ]; then
            echo "::error::krkrsdl3.app not produced"
            exit 1
          fi
          echo "--- bundle tree ---"
          ls -la "$APP"
          if [ ! -f "$APP/krkrsdl3" ]; then
            echo "::error::executable 'krkrsdl3' missing inside app bundle -> build did not link"
            echo "--- configure log tail ---"; tail -60 /tmp/configure.log || true
            echo "--- build log tail ---"; tail -180 /tmp/build.log || true
            exit 1
          fi
          echo "executable size: $(stat -f%z "$APP/krkrsdl3") bytes"
          echo "--- verified: bundle has executable ---"

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find src/out -type d -name "krkrsdl3.app" -not -path "*/build/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::krkrsdl3.app not found"
            find src/out -type d | head -60
            exit 1
          fi
          echo "APP=$APP"
          ls -la "$APP"
          echo "--- Info.plist (before) ---"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" 2>/dev/null | head -30 || true
          # 补齐 iOS 必需、但 CMake 没写进最终 plist 的键。
          # krkrsdl3_build 只把 bundle id 设成 Xcode target 的构建设置，最终 plist 里
          # 连 CFBundleIdentifier 都没有 -> Sideloadly 报 "Install failed: 'CFBundleIdentifier'"。
          python3 - "$APP/Info.plist" <<'PYEOF'
          import plistlib, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              pl = plistlib.load(f)
          added = []
          for k, v in [
              ("CFBundleIdentifier", "org.tvp.krkrsdl3"),
              ("CFBundleName", "krkrsdl3"),
              ("CFBundleVersion", "1"),
              ("CFBundleShortVersionString", "0.0.6"),
              ("UISupportedInterfaceOrientations",
               ["UIInterfaceOrientationPortrait",
                "UIInterfaceOrientationLandscapeLeft",
                "UIInterfaceOrientationLandscapeRight"]),
          ]:
              if not pl.get(k):
                  pl[k] = v
                  added.append(k)
          with open(p, "wb") as f:
              plistlib.dump(pl, f, fmt=plistlib.FMT_BINARY)
          print("plist fixed:", ", ".join(added) if added else "(already complete)")
          PYEOF
          echo "--- Info.plist (after) ---"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" 2>/dev/null | grep -E "CFBundleIdentifier|CFBundleName|CFBundleVersion|UISupportedInterfaceOrientations" || true
          rm -rf Payload krkrsdl3-device.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 预留 game/ 目录：本地注入数据时直接放进去
          mkdir -p "Payload/krkrsdl3.app/game"
          zip -qry krkrsdl3-device.ipa Payload
          ls -la krkrsdl3-device.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: krkrsdl3-ios-ipa
          path: krkrsdl3-device.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-build-${{ github.run_number }}" krkrsdl3-device.ipa \
            --title "krkrsdl3 iOS build #${{ github.run_number }}" \
            --notes "Unsigned iOS device ipa (patched to load game from bundle/game)." || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/configure.log
            /tmp/build.log
            src/out/**/*.log
            src/vcpkg-manifest-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump logs into the job output on failure
        if: failure()
        run: |
          echo "========== CONFIGURE LOG (tail 200) =========="
          tail -200 /tmp/configure.log 2>/dev/null || echo "(no configure log)"
          echo "========== BUILD LOG (tail 400) =========="
          tail -400 /tmp/build.log 2>/dev/null || echo "(no build log)"
