name: Build krkrsdl3 iOS IPA

# 在 GitHub 的 macOS runner 上把 krkrsdl3 编译成 iOS 设备版 .app 并打成未签名 ipa。
# 仓库只存这个工作流；引擎源码运行时从上游 clone，因此不含任何游戏数据。
#
# 关键改动（"打开就玩"）：environ/sdl3/sdl3_app.cpp 的 SDL_AppInit 要求 argc>=2、
# argv[1]=游戏目录，而 iOS 由 UIApplicationMain 启动、没有命令行，原版必然启动失败。
# 这里在编译前给它打一个补丁：iOS 下用 SDL_GetBasePath() 拼出 <bundle>/game 当 argv[1]。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS device build -> ipa
    runs-on: macos-14
    timeout-minutes: 355

    steps:
      - name: Toolchain info
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version | head -1
          git --version
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch krkrsdl3_build source
        run: |
          set -e
          git clone --recursive --shallow-submodules --depth 1 \
            https://github.com/krkrsdl3/krkrsdl3_build.git src
          echo "--- src top ---"
          ls src
          echo "--- submodule cpp ---"
          ls src/cpp | head -20
          ls -la src/CMakePresets.json src/vcpkg.json src/cpp/environ/sdl3/sdl3_app.cpp

      - name: Patch iOS entry (read game from app bundle)
        run: |
          python3 - <<'PYEOF'
          import io
          p = "src/cpp/environ/sdl3/sdl3_app.cpp"
          MARK = "[patched] iOS data :"
          SIG = "SDL_AppResult SDL_AppInit(void** appstate, int argc, char* argv[])"
          INC_ANCHOR = "#include <SDL3/SDL_main.h>"
          INC_ADD = "#include <SDL3/SDL_filesystem.h>"   # SDL_GetBasePath 在这里
          # 说明（源码实测结论）：
          #   TVPStorage.h 注释写明 TVPProjectData 应是 "file://*/Game/data.xp3>"
          #   或 "*/Game/data/"。传目录（无尾斜杠）会坏：
          #   TVPCheckExistentLocalFile() 用 S_ISREG，目录返回 false，于是不会追加
          #   归档分隔符 '>'，随后 TVPSetCurrentDirectory() 因末位不是分隔符而抛
          #   TVPMissingPathDelimiterAtLast。所以这里传 data.xp3（文件）——这也是
          #   桌面版/网页版跑通时的形态（网页那轮日志就是 file://./data.xp3 + 1138 个文件）。
          #   argv[0] 给可执行文件的绝对路径，让 TVPNativeExeDir 落在 bundle 根。
          # C 源码刻意不含反斜杠与单引号，便于在 Python 单引号串里零转义书写。
          INJECT = "\n".join([
              '#if defined(_KRKRSDL3_IOS)',
              '    /* patched: iOS has no command line, so synthesize argv.',
              '       argv[0] = absolute path of the app executable',
              '                 (so TVPNativeExeDir is the bundle root).',
              '       argv[1] = <bundle>/game/data.xp3 -- the project data has to be',
              '       the XP3 file, not the folder: TVPBeforeSystemInit() appends the',
              '       archive delimiter only when the path is a regular file, and',
              '       TVPSetCurrentDirectory() throws TVPMissingPathDelimiterAtLast',
              '       when the name has no trailing delimiter. With the xp3 the current',
              '       directory becomes <...>/game/data.xp3> and startup.tjs is found',
              '       inside the archive -- same as the desktop and web builds. */',
              '    {',
              '        static char s_exe[4096];',
              '        static char s_dat[4096];',
              '        static char* s_argv[2];',
              '        static int s_ready = 0;',
              '        if (!s_ready)',
              '        {',
              '            const char* base = SDL_GetBasePath();',
              '            if (!base || !base[0]) base = "./";',
              '            SDL_snprintf(s_exe, sizeof(s_exe), "%skrkrsdl3", base);',
              '            SDL_snprintf(s_dat, sizeof(s_dat), "%sgame/data.xp3", base);',
              '            s_argv[0] = s_exe;',
              '            s_argv[1] = s_dat;',
              '            s_ready = 1;',
              '            SDL_Log("[patched] iOS exe  : %s", s_exe);',
              '            SDL_Log("[patched] iOS data : %s", s_dat);',
              '        }',
              '        argc = 2; argv = s_argv;',
              '    }',
              '#endif',
              '',
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched")
          else:
              assert INC_ANCHOR in src, "SDL_main.h include not found"
              if INC_ADD not in src:
                  src = src.replace(INC_ANCHOR, INC_ANCHOR + "\n" + INC_ADD, 1)
              i = src.find(SIG)
              assert i >= 0, "SDL_AppInit signature not found"
              j = src.find("{", i)
              assert j >= 0, "opening brace not found"
              io.open(p, "w", encoding="utf-8", newline="").write(
                  src[:j + 1] + "\n" + INJECT + src[j + 1:])
              print("patched:", p)
          PYEOF
          echo "--- verify: includes ---"
          sed -n '1,12p' src/cpp/environ/sdl3/sdl3_app.cpp
          echo "--- verify: injected block ---"
          grep -n -A 4 "SDL_AppResult SDL_AppInit" src/cpp/environ/sdl3/sdl3_app.cpp | head -10 || true

      - name: Patch 7zCrc (disable ARM HW CRC for Apple clang)
        run: |
          python3 - <<'PYEOF'
          import io, re
          p = "src/cpp/plugins/Kirikiroid2/7zip/7zCrc.c"
          MARK = "ARM HW CRC disabled"
          PAT = re.compile(r"#define Z7_CRC_HW_USE(\r?\n)[ \t]*#include <arm_acle\.h>")
          REPL = ('/* patched: Apple clang lacks __target__("crc"); ARM HW CRC disabled */\\1'
                  '        /* #include <arm_acle.h> */')
          src = io.open(p, encoding="utf-8", errors="surrogateescape", newline="").read()
          if MARK in src:
              print("already patched")
          else:
              out, n = PAT.subn(REPL, src)
              assert n == 1, "expected exactly 1 match, got %d" % n
              io.open(p, "w", encoding="utf-8", errors="surrogateescape", newline="").write(out)
              print("patched:", p)
          PYEOF
          echo "--- verify: ARM HW CRC disabled, falls back to table CRC ---"
          grep -n -A 1 "ARM HW CRC disabled" src/cpp/plugins/Kirikiroid2/7zip/7zCrc.c | head -6

      - name: Patch iOS savedata path (bundle is read-only)
        run: |
          python3 - <<'PYEOF'
          import io
          p = "src/cpp/core/utils/TVPSettings.cpp"
          MARK = "iOS: the .app bundle is read-only"
          # 原始源码里的两行（必须一起换掉）
          L1 = '    TVPDataPath = TVPProjectDir + TJS_N("savedata/");'
          L2 = '    TVPNativeDataPath = TVPGetLocallyAccessibleName(TVPDataPath);'
          # C 源码刻意不含反斜杠与单引号，便于在 Python 单引号串里零转义书写
          NEW = "\n".join([
              '#if defined(_KRKRSDL3_IOS)',
              '    /* iOS: the .app bundle is read-only, so savedata and the engine log',
              '       must live in the writable sandbox (Documents).',
              '       TVPDataPath has to be a storage name (file://...) because the',
              '       next line feeds it to TVPGetLocallyAccessibleName(), which',
              '       looks the media up by name -- a raw native path contains no',
              '       colon, so the media lookup fails and throws',
              '       TVPUnsupportedMediaName (TJS::eTJSError -> uncaught -> abort).',
              '       So build the storage name explicitly and set the native path',
              '       directly instead of round-tripping through the media layer. */',
              '    ttstr krkrSandboxDir =',
              '        ttstr(TVPGetDefaultFileDir().c_str()) + TJS_N("/savedata/");',
              '    TVPDataPath = ttstr(TJS_N("file://.")) + krkrSandboxDir;',
              '    TVPNativeDataPath = krkrSandboxDir;',
              '#else',
              L1,
              L2,
              '#endif',
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched")
          else:
              assert src.count(L1) == 1, "expected exactly 1 TVPDataPath assignment"
              assert src.count(L2) == 1, "expected exactly 1 TVPNativeDataPath assignment"
              i = src.index(L1)
              j = src.index(L2, i)
              out = src[:i] + NEW + src[j + len(L2):]
              io.open(p, "w", encoding="utf-8", newline="").write(out)
              print("patched:", p)
          PYEOF
          echo "--- verify ---"
          grep -n -A 14 "iOS: the .app bundle is read-only" src/cpp/core/utils/TVPSettings.cpp | head -20

      - name: Patch iOS project data delimiter + auto-path diagnostics
        run: |
          python3 - <<'PYEOF'
          import io

          # --- 1) TVPBeforeSystemInit(): 目录形式缺尾部分隔符会抛异常（防御性补齐）---
          p1 = "src/cpp/core/main/TVPSystem.cpp"
          A1 = "    TVPSetCurrentDirectory(TVPProjectData);"
          MARK1 = "[patched] project data ->"
          D1 = "\n".join([
              "    else if (TVPProjectData.GetLastChar() != TJS_N('/'))",
              "    {",
              "        /* patched: TVPSetCurrentDirectory() below requires a trailing delimiter",
              "           (TVPInitializeBaseSystems() adds one via IncludeTrailingBackslash()).",
              "           A project dir passed as a plain folder path has none, because the",
              "           archive delimiter is only appended for a regular file. */",
              '        TVPProjectData += TJS_N("/");',
              "    }",
              '    TVPAddImportantLog(TJS_N("[patched] project data -> ") + TVPProjectData);',
              A1,
          ])
          s1 = io.open(p1, encoding="utf-8", newline="").read()
          if MARK1 in s1:
              print("already patched:", p1)
          else:
              assert s1.count(A1) == 1, "TVPSetCurrentDirectory(TVPProjectData) not unique"
              io.open(p1, "w", encoding="utf-8", newline="").write(s1.replace(A1, D1, 1))
              print("patched:", p1)

          # --- 2) TVPRebuildAutoPathTable(): 把自动路径表的真实内容打出来 ---
          p2 = "src/cpp/core/archive/TVPStorage.cpp"
          A2 = "    TVPAddLog((const tjs_char*)TVPInfoRebuildingAutoPath);"
          MARK2 = "[dbg] auto paths   ="
          D2 = "\n".join([
              A2,
              '    TVPAddImportantLog(TJS_N("[dbg] project data = ") + TVPProjectData);',
              '    TVPAddImportantLog(TJS_N("[dbg] project dir  = ") + TVPProjectDir);',
              '    TVPAddImportantLog(TJS_N("[dbg] auto paths   = ") + ttstr((tjs_int)TVPAutoPathList.size()));',
              "    {",
              "        std::vector<ttstr>::iterator dbgit;",
              "        for (dbgit = TVPAutoPathList.begin(); dbgit != TVPAutoPathList.end(); ++dbgit)",
              '            TVPAddImportantLog(TJS_N("[dbg]   entry: ") + *dbgit);',
              "    }",
          ])
          s2 = io.open(p2, encoding="utf-8", newline="").read()
          if MARK2 in s2:
              print("already patched:", p2)
          else:
              assert s2.count(A2) == 1, "TVPInfoRebuildingAutoPath log not unique"
              io.open(p2, "w", encoding="utf-8", newline="").write(s2.replace(A2, D2, 1))
              print("patched:", p2)
          PYEOF
          echo "--- verify 1: project data ---"
          grep -n -B 2 -A 3 "project data ->" src/cpp/core/main/TVPSystem.cpp | head -14
          echo "--- verify 2: auto path dump ---"
          grep -n -A 3 "auto paths   =" src/cpp/core/archive/TVPStorage.cpp | head -8
          echo "--- verify 3: TVPAddImportantLog 在本文件可见 ---"
          grep -c "TVPAddImportantLog" src/cpp/core/archive/TVPStorage.cpp

      - name: Patch iOS startup-exception logging
        run: |
          python3 - <<'PYEOF'
          import io
          # StartApplication() 只 catch EAbort，游戏脚本的 TJS 异常会带着消息
          # 直接逃逸 -> abort，什么都看不见。这里在逃逸前把消息和 trace 打进日志。
          p = "src/cpp/core/main/TVPApplication.cpp"
          A = "        TVPInitializeStartupScript();"
          MARK = "[dbg] startup script exception:"
          D = "\n".join([
              "        try",
              "        {",
              "            TVPInitializeStartupScript();",
              "        }",
              "        catch (const TJS::eTJSScriptException& e)",
              "        {",
              "            /* patched: log the game script exception (message + trace)",
              "               log it and CONTINUE -- krkr2/Kirikiroid2 show an ignorable\n"
              "               dialog here instead of aborting; game-specific init\n"
              "               errors (e.g. missing movie-quality menu item on iOS)\n"
              "               are non-fatal. */",
              '            TVPAddImportantLog(TJS_N("[dbg] startup script exception: ") + e.GetMessage());',
              '            TVPAddImportantLog(TJS_N("[dbg] trace: ") + e.GetTrace());',
              "        }",
              "        catch (const TJS::eTJS& e)",
              "        {",
              "            /* patched: log and continue (see above). */",
              '            TVPAddImportantLog(TJS_N("[dbg] startup script error: ") + e.GetMessage());',
              "        }",
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched:", p)
          else:
              assert src.count(A) == 1, "TVPInitializeStartupScript() call not unique"
              io.open(p, "w", encoding="utf-8", newline="").write(src.replace(A, D, 1))
              print("patched:", p)
          PYEOF
          echo "--- verify ---"
          grep -n -A 4 "startup script exception: " src/cpp/core/main/TVPApplication.cpp | head -8

      - name: Patch iOS storage-miss logging
        run: |
          python3 - <<'PYEOF'
          import io
          # 游戏的安装自检（Storages.tjs(88)「解像度別データがありません」）走的是
          # Storages.isExistentStorage，失败时不留任何痕迹。把 miss 的名字打进日志，
          # 就能知道它到底在找哪个文件。
          p = "src/cpp/core/archive/TVPStorage.cpp"
          A = (
              "bool TVPIsExistentStorage(const ttstr& name)\n"
              "{\n"
              "    return !TVPGetPlacedPath(name).IsEmpty();\n"
              "}"
          )
          MARK = "[dbg] storage miss: "
          D = "\n".join([
              "bool TVPIsExistentStorage(const ttstr& name)",
              "{",
              "    ttstr krkrPlaced = TVPGetPlacedPath(name);",
              "    if (krkrPlaced.IsEmpty())",
              "    {",
              "        /* patched: log which storage the game checks and misses --",
              "           existence checks fail silently otherwise. */",
              '        TVPAddLog(TJS_N("[dbg] storage miss: ") + name);',
              "    }",
              "    return !krkrPlaced.IsEmpty();",
              "}",
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched:", p)
          else:
              assert src.count(A) == 1, "TVPIsExistentStorage body not unique"
              io.open(p, "w", encoding="utf-8", newline="").write(src.replace(A, D, 1))
              print("patched:", p)
          PYEOF
          echo "--- verify ---"
          grep -n -A 3 "storage miss: " src/cpp/core/archive/TVPStorage.cpp | head -6 || true

      - name: Patch iOS tjs2 exception logging (message + position + block dump)
        run: |
          python3 - <<'PYEOF'
          import io
          # tjs2 的 VM dump 只打代码和寄存器，不打异常消息；这里在 AddTrace 之后、
          # rethrow 之前把消息 + 位置打进 console（进 krkr-ios.log）。
          # 遇到 "Not a function" 这类错误时，再把当前脚本块整体反汇编一遍 ——
          # 加密脚本（main/*.tjs）只以字节码形式在内存里，这是唯一能看到它代码的办法。
          p = "src/cpp/tjs2/tjsInterCodeExec.cpp"
          MARK = "[dbg] at: "
          A = (
              "        e.AddTrace(this, (tjs_int)(codesave - CodeArea));" + chr(10) +
              "        throw e;"
          )
          D = chr(10).join([
              "        e.AddTrace(this, (tjs_int)(codesave - CodeArea));",
              "        /* patched: surface the exception message, source position, and",
              "           (for unknown-callee errors) the disassembly of this script",
              "           block -- encrypted game scripts only exist as bytecode. */",
              "        Block->GetTJS()->OutputToConsole(",
              "            (TJS_N(\"[dbg] script exception: \") + e.GetMessage()).c_str());",
              "        Block->GetTJS()->OutputToConsole(",
              "            (TJS_N(\"[dbg] at: \") + GetPositionDescriptionString((tjs_int)(codesave - CodeArea))).c_str());",
              "        if (TJS_strstr(e.GetMessage().c_str(), TJS_N(\"Not a function\")) != NULL)",
              "        {",
              "            Block->GetTJS()->OutputToConsole(TJS_N(\"[dbg] block dump follows\"));",
              "            Block->Dump();",
              "        }",
              "        throw e;",
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched:", p)
          else:
              assert src.count(A) == 2, "AddTrace+throw pair count = %d (expect 2)" % src.count(A)
              io.open(p, "w", encoding="utf-8", newline="").write(src.replace(A, D))
              print("patched:", p, "(2 sites)")
          PYEOF
          echo "--- verify ---"
          grep -n "\[dbg\] at: \|block dump follows" src/cpp/tjs2/tjsInterCodeExec.cpp | head -6

      - name: Patch iOS about-string capability probe
        run: |
          python3 - <<'PYEOF'
          import io
          # game scripts (sysscn/movieqsel.tjs) probe System.getAboutString()
          # for "kirikiriz" / "(info) IDirect3D9" to decide whether to create
          # the movie-quality menu (movieQualitySelectMenuItem). krkrsdl3 iOS
          # reports neither -> menu never built -> custom.tjs(211) throws.
          # Report Z-compatible capabilities so the menu gets created.
          # NOTE: injected C++ deliberately contains no backslashes.
          p = "src/cpp/core/msg/TVPMsg.cpp"
          A = (
              "    return TVPFormatMessage(TVPReadAboutStringFromResource().c_str(), verstr, tjsverstr) +\n"
              "           TVPGetImportantLog();\n"
              "}"
          )
          MARK = "kirikiriz compatible engine"
          L1 = "    ttstr krkrAbout = TVPFormatMessage(TVPReadAboutStringFromResource().c_str(), verstr, tjsverstr) +"
          L2 = "           TVPGetImportantLog();"
          L3 = "#ifdef _KRKRSDL3_IOS"
          L4 = "    /* patched: game capability probe (kirikiriz / IDirect3D9) */"
          L5 = '    krkrAbout += TJS_N("! (info) IDirect3D9 or higher detected. Retrieving current Direct3D driver information...");'
          L6 = '    krkrAbout += TJS_N("! (info) kirikiriz compatible engine");'
          L7 = "#endif"
          L8 = "    return krkrAbout;"
          L9 = "}"
          D = "\n".join([L1, L2, L3, L4, L5, L6, L7, L8, L9])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched:", p)
          else:
              assert src.count(A) == 1, "AboutString return not unique (%d)" % src.count(A)
              io.open(p, "w", encoding="utf-8", newline="").write(src.replace(A, D, 1))
              print("patched:", p)
          PYEOF
          echo "--- verify ---"
          grep -n -A 2 "kirikiriz compatible" src/cpp/core/msg/TVPMsg.cpp | head -4

      - name: Patch iOS missing menu-item fallback (tjs2 property get)
        run: |
          python3 - <<'PYEOF'
          import io
          # main/custom.tjs reads a config menu item that the game only creates
          # when movie files are present (absent in this data subset). Return an
          # inert placeholder instead of throwing, so init can finish.
          p = "src/cpp/tjs2/tjsInterCodeExec.cpp"
          MARK = "substituted missing member"
          INC_A = '#include "tjsNative.h"'
          INC_B = INC_A + chr(10) + '#include "tjsArray.h"'
          A = (
              "    hr = clo.PropGet(flags, name->GetString(), name->GetHint(), TJS_GET_VM_REG_ADDR(ra, code[1])," + chr(10) +
              "                     clo.ObjThis ? clo.ObjThis : ra[-1].AsObjectNoAddRef());" + chr(10) +
              "    if (TJS_FAILED(hr))" + chr(10) +
              "        TJSThrowFrom_tjs_error(hr, TJS_GET_VM_REG(DataArea, code[3]).GetString());"
          )
          D = chr(10).join([
              "    hr = clo.PropGet(flags, name->GetString(), name->GetHint(), TJS_GET_VM_REG_ADDR(ra, code[1]),",
              "                     clo.ObjThis ? clo.ObjThis : ra[-1].AsObjectNoAddRef());",
              "    if (TJS_FAILED(hr))",
              "    {",
              "        /* patched: inert placeholder for the config menu item the game",
              "           skips building on this engine (no movie files present). */",
              "        if (hr == TJS_E_MEMBERNOTFOUND && name->Type() == tvtString &&",
              "            TJS_strcmp(name->GetString(), TJS_N(\"movieQualitySelectMenuItem\")) == 0)",
              "        {",
              "            iTJSDispatch2* krkrChildren = TJSCreateArrayObject();",
              "            iTJSDispatch2* krkrItem = TJSCreateArrayObject();",
              "            tTJSVariant krkrCV(krkrChildren, krkrChildren);",
              "            krkrItem->PropSet(TJS_MEMBERENSURE, TJS_N(\"children\"), NULL, &krkrCV, krkrItem);",
              "            krkrChildren->Release();",
              "            tTJSVariant krkrIV(krkrItem, krkrItem);",
              "            krkrItem->Release();",
              "            *TJS_GET_VM_REG_ADDR(ra, code[1]) = krkrIV;",
              "            Block->GetTJS()->OutputToConsole(TJS_N(\"[dbg] substituted missing member: movieQualitySelectMenuItem\"));",
              "            return;",
              "        }",
              "        TJSThrowFrom_tjs_error(hr, TJS_GET_VM_REG(DataArea, code[3]).GetString());",
              "    }",
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched:", p)
          else:
              assert src.count(A) == 1, "GetPropertyDirect tail not unique (%d)" % src.count(A)
              src = src.replace(A, D, 1)
              assert src.count(INC_A) == 1, "include anchor not unique (%d)" % src.count(INC_A)
              src = src.replace(INC_A, INC_B, 1)
              io.open(p, "w", encoding="utf-8", newline="").write(src)
              print("patched:", p)
          PYEOF
          echo "--- verify ---"
          grep -n -A 2 "substituted missing member" src/cpp/tjs2/tjsInterCodeExec.cpp | head -5

      - name: Patch iOS frame-loop present + pipeline diagnostics
        run: |
          python3 - <<'PYEOF'
          import io, sys

          # r22 之后的收尾（画面已经出来了）：
          #   -render=software 保持不变（iOS 上必须走 SDL_Renderer/Metal，
          #   GL/EAGL 的呈现通路上不了屏）；本轮把两处排查用的痕迹清掉：
          #     (1) 软渲染清屏色 绿 -> 不透明黑（正常 letterbox 黑边）；
          #     (2) 关掉 TVPIsExistentStorage() 里的 "[dbg] storage miss" 日志
          #         —— 游戏每次运行会做几千次存在性检查（上次日志 9771 条），
          #         每条都写文件，在手机上是实打实的 I/O 负担。
