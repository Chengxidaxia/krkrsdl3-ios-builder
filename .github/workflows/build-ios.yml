                            '    SDL_GetWindowSize(tvp_window, w, h);\n}',
                        "get-window-size")
              s1 = sub1(s1, 'void TVPGetWindowSizeInPixels(int* w, int* h)\n{\n    SDL_GetWindowSizeInPixels(tvp_window, w, h);\n}',
                            'void TVPGetWindowSizeInPixels(int* w, int* h)\n{\n'
                            '    /* r30: see TVPGetWindowSize -- keep SDL\'s own space. */\n'
                            '    SDL_GetWindowSizeInPixels(tvp_window, w, h);\n}',
                        "get-window-size-px")
              s1 = sub1(s1, '    int RW = 1280, RH = 720;\n    SDL_GetWindowSize(tvp_window, &RW, &RH);',
                            '    int RW = 1280, RH = 720;\n'
                            '    /* r30: the frame loop must pass the space the renderer draws in.\n'
                            '       r29 passed the UIKit physical size (1624x750) and the letterbox came\n'
                            '       out shifted/clipped; SDL_GetRenderOutputSize() is that space. */\n'
                            '    SDL_GetRenderOutputSize(tvp_renderer, &RW, &RH);\n'
                            '    if (RW <= 0 || RH <= 0)\n'
                            '        SDL_GetWindowSize(tvp_window, &RW, &RH);\n'
                            '    /* patched (r42): present at PHYSICAL pixel resolution.\n'
                            '       On iOS the render output space is the window size in POINTS\n'
                            '       (812x375) while the panel has 1624x750 physical pixels, so the\n'
                            '       whole scene was rasterised at 812x375 and then stretched 2x by\n'
                            '       the presentation path with no extra detail anywhere -- that is\n'
                            '       the other half of the "blurry" complaint (NEAREST texture\n'
                            '       sampling, fixed in TVPCreateTextureBackend, is the first half).\n'
                            '\n'
                            '       SDL_SetRenderLogicalPresentation() separates the coordinate space\n'
                            '       RenderTexture draws in from the drawable size. Asking for the\n'
                            '       physical size makes the letterbox/scale math below run in real\n'
                            '       pixels, so the picture is generated once at full resolution\n'
                            '       instead of being magnified after the fact.\n'
                            '\n'
                            '       SDL_LOGICAL_PRESENTATION_LETTERBOX matches what this engine\n'
                            '       already does by hand (TVPCalcLetterbox centres a min-scale-fitted\n'
                            '       rect), so it must not move anything -- it only supplies the\n'
                            '       pixel grid. Skipped when UIKit is not up yet (krkrIOSRealW == 0,\n'
                            '       very early frames) to keep the previous behaviour instead of\n'
                            '       presenting at 0x0. */\n'
                            '    if (krkrIOSRealW > 0 && krkrIOSRealH > 0)\n'
                            '        SDL_SetRenderLogicalPresentation(tvp_renderer, krkrIOSRealW,\n'
                            '            krkrIOSRealH, SDL_LOGICAL_PRESENTATION_LETTERBOX);',
                        "iterate-size")
              save(p1, s1, crlf1)
              print("patched:", p1)

          # ---- TVPStorage.cpp：关掉 storage-miss 日志（性能）----
          p2 = "src/cpp/core/archive/TVPStorage.cpp"
          A2 = ("bool TVPIsExistentStorage(const ttstr& name)\n"
                "{\n"
                "    ttstr krkrPlaced = TVPGetPlacedPath(name);\n"
                "    if (krkrPlaced.IsEmpty())\n"
                "    {\n"
                "        /* patched: log which storage the game checks and misses --\n"
                "           existence checks fail silently otherwise. */\n"
                '        TVPAddLog(TJS_N("[dbg] storage miss: ") + name);\n'
                "    }\n"
                "    return !krkrPlaced.IsEmpty();\n"
                "}")
          D2 = ("bool TVPIsExistentStorage(const ttstr& name)\n"
                "{\n"
                "    /* patched: miss logging removed -- it was a bring-up diagnostic, and the\n"
                "       game performs thousands of existence checks per run; each log line\n"
                "       costs file I/O on a phone. Back to the plain implementation. */\n"
                "    return !TVPGetPlacedPath(name).IsEmpty();\n"
                "}")
          MARK2 = "miss logging removed"
          s2, crlf2 = load(p2)
          if MARK2 in s2:
              print("already patched:", p2)
          else:
              s2 = sub1(s2, A2, D2, "miss-log-removal")
              save(p2, s2, crlf2)
              print("patched:", p2, "crlf=%s" % crlf2)

          # ---- 3) 屏幕尺寸：让游戏按原生 16:9 设计分辨率(1280x720)布局 ----
          # 根因：之前上报真实窗口 812x375（比 16:9 更宽），游戏据此把 16:9 内容用
          # cover 铺满 -> 上下被裁；引擎 contain 只负责左右留黑边，最终是
          # 「左右黑边 + 内容没全」。改成上报 1280x720（= 主层/贴图尺寸），游戏按
          # 1:1 铺满，引擎 contain 给左右黑边 + 完整画面。
          # 输入不受影响：KRKR_Trig_MouseDown 已用 (x-xPos)/scale 把窗口像素反算回
          # 1280x720 贴图坐标，所以改上报尺寸不会点歪。
          # r29: 这台设备上 SDL_GetCurrentDisplayMode 在 iOS 只给 480x320，所以这个
          # 上报值必须走 KrkrGetRealScreenSize()，否则 System.screenWidth 依旧是
          # 480x320，游戏会按 3:2 而非 16:9 排版（r28 日志 `SIZE screen=1280x720`
          # 那一行是旧补丁硬编码 1280/720 的结果，本轮改为真实值以保持一致）。
          p3 = "src/cpp/environ/sdl3/sdl3_utils.cpp"
          MARK3 = "patched: design resolution"
          GW = ("int tTVPScreen::GetWidth()\n"
                "{\n"
                "    SDL_DisplayID display = SDL_GetPrimaryDisplay();\n"
                "    const SDL_DisplayMode* mode = SDL_GetCurrentDisplayMode(display);\n"
                "    return mode ? mode->w : 0;\n"
                "}")
          GWn = ("int tTVPScreen::GetWidth()\n"
                 "{\n"
                 "    /* patched: design resolution -- and it must be reported as the CANVAS\n"
                 "       size (1280x720), NOT the game's 1920x1080 layout size.\n"
                 "\n"
                 "       r30 reported 1280x720, r32 reported 1920x1080; on the device the\n"
                 "       picture stayed cropped either way, so this looked like a dead end for\n"
                 "       a long time. The wasm A/B (same engine + same data, built for\n"
                 "       Emscripten and driven headlessly) finally separated the variables:\n"
                 "           wasm : screenWidth = 800x600   -> picture COMPLETE\n"
                 "           iOS  : screenWidth = 1920x1080 -> picture cropped (top-left)\n"
                 "       with kag.scWidth/scHeight pinned to 1920x1080 by patch.tjs in BOTH.\n"
                 "       The only differing input is this value -- and 1920x1080 is exactly\n"
                 "       the game's own layout size, so KAG's adapt step computes\n"
                 "       min(screen/layout) = 1.0, i.e. \"the screen is already the right\n"
                 "       size, no scaling needed\", and paints the 1920x1080 layout straight\n"
                 "       onto the 1280x720 canvas -- only its top-left 1280x720 survives.\n"
                 "\n"
                 "       Reporting the canvas size makes screen != layout, KAG applies its\n"
                 "       contain scale (1280/1920 = 0.667) and the whole picture lands on the\n"
                 "       canvas. The on-screen size is unchanged: the engine still letterboxes\n"
                 "       the 1280x720 canvas into 812x375 -> 667x375 (TVPCalcLetterbox), so\n"
                 "       the picture keeps its size and is complete instead of cropped. Input\n"
                 "       is unaffected: KRKR_Trig_MouseDown maps window pixels back through\n"
                 "       (x - xPos) / scale.\n"
                 "\n"
                 "       Do NOT put the physical screen size here (r29 tried 1624x750): it is\n"
                 "       neither the layout size nor the canvas, and it only made the scaling\n"
                 "       unpredictable. */\n"
                 "    return 1280;\n"
                 "}")
          s3, crlf3 = load(p3)
          if MARK3 in s3:
              print("already patched:", p3)
          else:
              s3 = sub1(s3, 'bool TVP_stat(const char* name, tTVP_stat& s)',
                            '/* patched: tvp_window is defined in sdl3_app.cpp. */\n'
                            'extern SDL_Window* tvp_window;\n'
                            '\n'
                            'bool TVP_stat(const char* name, tTVP_stat& s)', "extern-window")
              s3 = sub1(s3, GW, GWn, "get-width")
              GH = ("int tTVPScreen::GetHeight()\n"
                    "{\n"
                    "    SDL_DisplayID display = SDL_GetPrimaryDisplay();\n"
                    "    const SDL_DisplayMode* mode = SDL_GetCurrentDisplayMode(display);\n"
                    "    return mode ? mode->h : 0;\n"
                    "}")
              GHn = ("int tTVPScreen::GetHeight()\n"
                     "{\n"
                     "    /* patched: design resolution (height, see GetWidth).\n"
                     "       Deliberately the CANVAS height 720, not the 1920x1080 layout\n"
                     "       height -- see the note in GetWidth. */\n"
                     "    return 720;\n"
                     "}")
              s3 = sub1(s3, GH, GHn, "get-height")
              save(p3, s3, crlf3)
              print("patched:", p3, "crlf=%s" % crlf3)
          # ---- 4) r28: 真实屏幕尺寸（SDL 在 iOS 上报告 480x320，不可用）----
          # r27 日志铁证：`[patched] iOS display=480x320 window=480x320 pixels=480x320`
          # —— SDL_GetDisplayUsableBounds / SDL_GetWindowSizeInPixels 在 iOS 上
          # 三者全是 480x320，所以 r27 的"窗口 != 可用区才校正"判断永远为假，
          # 一个字节都没改。改从 UIKit 拿真实尺寸：ios_core.mm 里加一个
          # C 函数 KrkrGetRealScreenSize()。
          p4 = "src/cpp/environ/iOS/ios_core.mm"
          MARK4 = "patched: real screen size from UIKit"
          HOOK4 = (
              "\n"
              "/* ===================== patched: real screen size from UIKit =====================\n"
              "   SDL on iOS reports 480x320 for BOTH the display bounds and the window size\n"
              "   in pixels (see the r27 log line \"iOS display=480x320 window=480x320\n"
              "   pixels=480x320\"), so nothing derived from SDL can tell us the real screen.\n"
              "   r29: the true root cause is the missing UILaunchScreen in Info.plist (see\n"
              "   ci/inject_and_pack.py) -- iOS was launching the app in legacy compatibility\n"
              "   scaling, which pins the logical screen to 640x960 (320x480@2x).  With the\n"
              "   launch screen declared, UIKit hands us the native size; this function reads\n"
              "   it from the KEY WINDOW (bounds * scale, already in the current orientation)\n"
              "   and falls back to UIScreen.nativeBounds. */\n"
              "extern \"C\" void KrkrGetRealScreenSize(int* outW, int* outH)\n"
              "{\n"
              "    int w = 0, h = 0;\n"
              "    @autoreleasepool\n"
              "    {\n"
              "        /* r29: prefer the KEY WINDOW's bounds * its scale.  That value is\n"
              "           already expressed in the CURRENT interface orientation (no manual\n"
              "           axis swap needed) and is in physical pixels (scale = 2 or 3).\n"
              "           UIScreen.nativeBounds is the fallback: it is always given in the\n"
              "           device's natural PORTRAIT orientation, so the axes have to be\n"
              "           swapped whenever we are landscape.  r28 only compared the two\n"
              "           orientation enums and still reported 640x960 (portrait) while the\n"
              "           window was landscape -- exactly the kind of silent mismatch that\n"
              "           costs another build, so derive the orientation from the sizes\n"
              "           themselves instead of trusting an enum. */\n"
              "        UIWindow* krkrKeyWin = nil;\n"
              "        UIWindowScene* krkrScene = nil;\n"
              "        for (UIScene* s in UIApplication.sharedApplication.connectedScenes)\n"
              "        {\n"
              "            if (![s isKindOfClass:UIWindowScene.class])\n"
              "                continue;\n"
              "            UIWindowScene* ws = (UIWindowScene*)s;\n"
              "            for (UIWindow* ww in ws.windows)\n"
              "            {\n"
              "                if (ww.isKeyWindow) { krkrKeyWin = ww; break; }\n"
              "            }\n"
              "            if (!krkrKeyWin && ws.windows.count)\n"
              "                krkrKeyWin = ws.windows.firstObject;\n"
              "            if (krkrKeyWin) { krkrScene = ws; break; }\n"
              "        }\n"
              "        float krkrScale = 0.0f;\n"
              "        CGRect krkrBounds = CGRectZero;\n"
              "        if (krkrKeyWin)\n"
              "        {\n"
              "            krkrScale = krkrKeyWin.screen ? krkrKeyWin.screen.scale\n"
              "                                          : [UIScreen mainScreen].scale;\n"
              "            krkrBounds = krkrKeyWin.bounds;\n"
              "        }\n"
              "        if (krkrBounds.size.width > 0 && krkrBounds.size.height > 0 && krkrScale > 0)\n"
              "        {\n"
              "            w = (int)(krkrBounds.size.width * krkrScale + 0.5);\n"
              "            h = (int)(krkrBounds.size.height * krkrScale + 0.5);\n"
              "        }\n"
              "        else\n"
              "        {\n"
              "            UIScreen* sc = [UIScreen mainScreen];\n"
              "            CGRect nb = sc ? [sc nativeBounds] : CGRectZero;\n"
              "            w = (int)(nb.size.width + 0.5);\n"
              "            h = (int)(nb.size.height + 0.5);\n"
              "            UIInterfaceOrientation o = UIInterfaceOrientationUnknown;\n"
              "            if (@available(iOS 13.0, *))\n"
              "            {\n"
              "                if (krkrScene)\n"
              "                    o = krkrScene.interfaceOrientation;\n"
              "            }\n"
              "            if (o == UIInterfaceOrientationUnknown)\n"
              "            {\n"
              "                for (UIWindow* ww in UIApplication.sharedApplication.windows)\n"
              "                {\n"
              "                    if (ww.windowScene)\n"
              "                    { o = ww.windowScene.interfaceOrientation; break; }\n"
              "                }\n"
              "            }\n"
              "            BOOL krkrLandscape = (o == UIInterfaceOrientationLandscapeLeft ||\n"
              "                                  o == UIInterfaceOrientationLandscapeRight);\n"
              "            /* 方向枚举不可靠时，用 nativeBounds 自身的形状兜底：\n"
              "               竖屏机型上 w < h，一旦 w > h 就说明是横屏基准。 */\n"
              "            if (o == UIInterfaceOrientationUnknown && w > h)\n"
              "                krkrLandscape = YES;\n"
              "            if (krkrLandscape)\n"
              "            { int t = w; w = h; h = t; }\n"
              "        }\n"
              "    }\n"
              "    if (outW) *outW = w;\n"
              "    if (outH) *outH = h;\n"
              "}\n")
          s4, crlf4 = load(p4)
          if MARK4 in s4:
              print("already patched:", p4)
          else:
              assert "TVPSetGameRunningOrientation" in s4, "ios_core.mm content unexpected"
              save(p4, s4 + HOOK4, crlf4)
              print("patched:", p4, "crlf=%s" % crlf4)
          PYEOF
          echo "--- verify: render option kept ---"
          grep -c "render=software" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: letterbox is opaque black now ---"
          grep -n "SDL_SetRenderDrawColor" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: miss logging removed ---"
          grep -c "storage miss: " src/cpp/core/archive/TVPStorage.cpp || true
          echo "--- verify: miss logging removal marker ---"
          grep -n "miss logging removed" src/cpp/core/archive/TVPStorage.cpp || true
          echo "--- verify: screen size reports the game DESIGN resolution (1920x1080) ---"
          grep -n "patched: design resolution" src/cpp/environ/sdl3/sdl3_utils.cpp || true
          echo "--- verify: tvp_window exported ---"
          grep -n "^SDL_Window\* tvp_window;" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: forced letterbox in place ---"
          grep -n "force aspect-correct letterboxing" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: real screen size from UIKit ---"
          grep -n "KrkrGetRealScreenSize" src/cpp/environ/iOS/ios_core.mm || true
          grep -n "KrkrGetRealScreenSize" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: r29/r30 real-size globals + diagnostics ---"
          grep -n "^int krkrIOSRealW = 0;" src/cpp/environ/sdl3/sdl3_app.cpp || true
          grep -n "krkrIOSRealW" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: r30 render math uses the RENDERER output space ---"
          grep -n "SDL_GetRenderOutputSize" src/cpp/environ/sdl3/sdl3_app.cpp || true
          grep -c "krkrIOSRealW" src/cpp/environ/sdl3/sdl3_utils.cpp || true
          echo "--- verify: SDL_SetWindowSize no longer called (it is ignored on iOS) ---"
          grep -c "SDL_SetWindowSize(tvp_window, krkrRealW" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: r42 iOS handles MOUSE events (the tap fix) ---"
          grep -n "patched (r42): _KRKRSDL3_IOS added to the mouse-event platform list" src/cpp/environ/sdl3/sdl3_app.cpp || true
          grep -c "_KRKRSDL3_MACOS) || defined(_KRKRSDL3_IOS)" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: r42 linear texture filtering (the sharpness fix) ---"
          grep -n "SDL_SCALEMODE_LINEAR" src/cpp/environ/sdl3/sdl3_app.cpp || true
          echo "--- verify: r42 physical-pixel presentation ---"
          grep -n "SDL_SetRenderLogicalPresentation" src/cpp/environ/sdl3/sdl3_app.cpp || true
      - name: Patch iOS crash capture (log + uncaught exception -> Documents)
        run: |
          python3 - <<'PYEOF'
          import io
          p = "src/cpp/environ/iOS/ios_core.mm"
          MARK = "patched: iOS log + crash capture"
          # 注意：下面的 C/ObjC 源码刻意不含反斜杠与单引号，
          # 这样可以在 Python 单引号字符串里原样书写，不需要转义。
          HOOK = "\n".join([
              '',
              '/* ===================== patched: iOS log + crash capture ===================== */',
              '#import <stdio.h>',
              '#import <stdlib.h>',
              '#import <unistd.h>',
              '#import <fcntl.h>',
              '#import <sys/stat.h>',
              '',
              'static void krkrPuts(const char* s)',
              '{',
              '    fputs(s ? s : "(null)", stderr);',
              '    fputc(10, stderr);',
              '}',
              '',
              'static void krkrUncaught(NSException* e)',
              '{',
              '    fputs("========== UNCAUGHT OBJC EXCEPTION ==========", stderr);',
              '    fputc(10, stderr);',
              '    fputs("name  : ", stderr);',
              '    fputs(e.name ? [e.name UTF8String] : "(nil)", stderr);',
              '    fputc(10, stderr);',
              '    fputs("reason: ", stderr);',
              '    fputs(e.reason ? [e.reason UTF8String] : "(nil)", stderr);',
              '    fputc(10, stderr);',
              '    if (e.userInfo)',
              '    {',
              '        fputs("userInfo: ", stderr);',
              '        fputs([[e.userInfo description] UTF8String], stderr);',
              '        fputc(10, stderr);',
              '    }',
              '    if (e.callStackSymbols)',
              '    {',
              '        fputs("callStackSymbols:", stderr);',
              '        fputc(10, stderr);',
              '        for (NSString* sym in e.callStackSymbols)',
              '        {',
              '            fputs([sym UTF8String], stderr);',
              '            fputc(10, stderr);',
              '        }',
              '    }',
              '    fputs("========== END EXCEPTION ==========", stderr);',
              '    fputc(10, stderr);',
              '    fflush(stderr);',
              '}',
              '',
              '__attribute__((constructor)) static void krkrLogInit(void)',
              '{',
              '    @autoreleasepool',
              '    {',
              '        char dir[2048];',
              '        char logp[2048];',
              '        const char* home = getenv("HOME");',
              '        if (!home || !home[0]) home = "/tmp";',
              '        snprintf(dir, sizeof(dir), "%s/Documents", home);',
              '        mkdir(dir, 0755);',
              '        snprintf(logp, sizeof(logp), "%s/krkr-ios.log", dir);',
              '        int fd = open(logp, O_WRONLY | O_CREAT | O_TRUNC, 0644);',
              '        if (fd >= 0)',
              '        {',
              '            dup2(fd, STDOUT_FILENO);',
              '            dup2(fd, STDERR_FILENO);',
              '            if (fd > STDERR_FILENO) close(fd);',
              '        }',
              '        setvbuf(stdout, NULL, _IONBF, 0);',
              '        setvbuf(stderr, NULL, _IONBF, 0);',
              '        NSSetUncaughtExceptionHandler(&krkrUncaught);',
              '        fputs("[hook] krkrsdl3 iOS start", stderr);',
              '        fputc(10, stderr);',
              '        fputs("[hook] bundle   : ", stderr);',
              '        krkrPuts([[[NSBundle mainBundle] bundlePath] UTF8String]);',
              '        fputs("[hook] documents: ", stderr);',
              '        krkrPuts(dir);',
              '        fputs("[hook] infoDictionary:", stderr);',
              '        fputc(10, stderr);',
              '        krkrPuts([[[[NSBundle mainBundle] infoDictionary] description] UTF8String]);',
              '        fputs("[hook] bundle/game:", stderr);',
              '        fputc(10, stderr);',
              '        {',
              '            NSString* gd = [[[NSBundle mainBundle] bundlePath]',
              '                stringByAppendingPathComponent:@"game"];',
              '            NSArray* items = [[NSFileManager defaultManager]',
              '                contentsOfDirectoryAtPath:gd error:nil];',
              '            for (NSString* it in items)',
              '            {',
              '                fputs("    ", stderr);',
              '                krkrPuts([it UTF8String]);',
              '            }',
              '        }',
              '        fflush(stderr);',
              '    }',
              '}',
          ])
          src = io.open(p, encoding="utf-8", newline="").read()
          if MARK in src:
              print("already patched")
          else:
              assert "TVPSetGameRunningOrientation" in src, "ios_core.mm content unexpected"
              io.open(p, "w", encoding="utf-8", newline="").write(src + HOOK + "\n")
              print("patched:", p)
          PYEOF
          echo "--- verify ---"
          grep -n -E "krkr-ios.log|NSSetUncaughtExceptionHandler|krkrUncaught" src/cpp/environ/iOS/ios_core.mm

      - name: Setup vcpkg
        env:
          VCPKG_DISABLE_METRICS: 1
        run: |
          set -e
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          "$VCPKG_DIR/vcpkg" version

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-bincache
            ${{ runner.temp }}/vcpkg/downloads
          key: vcpkg-ios-${{ hashFiles('src/vcpkg.json') }}
          restore-keys: |
            vcpkg-ios-

      - name: Configure (iOS Device)
        working-directory: src
        run: |
          set -o pipefail   # 关键：防止 | tail 把 cmake 的失败退出码吃掉
          cmake --preset "iOS Device Config" -DUSE_RENDER_VK=OFF 2>&1 | tee /tmp/configure.log | tail -80

      - name: Build (iOS Device Release)
        working-directory: src
        run: |
          set -o pipefail   # 关键：同上
          cmake --build --preset "iOS Device Release Build" --parallel 2>&1 | tee /tmp/build.log | tail -150

      - name: Verify app bundle completeness
        run: |
          APP=$(find src/out -type d -name "krkrsdl3.app" -not -path "*/build/*" | head -1)
          echo "APP=$APP"
          find src/out -maxdepth 4 | head -60
          if [ -z "$APP" ]; then
            echo "::error::krkrsdl3.app not produced"
            exit 1
          fi
          echo "--- bundle tree ---"
          ls -la "$APP"
          if [ ! -f "$APP/krkrsdl3" ]; then
            echo "::error::executable 'krkrsdl3' missing inside app bundle -> build did not link"
            echo "--- configure log tail ---"; tail -60 /tmp/configure.log || true
            echo "--- build log tail ---"; tail -180 /tmp/build.log || true
            exit 1
          fi
          echo "executable size: $(stat -f%z "$APP/krkrsdl3") bytes"
          echo "--- verified: bundle has executable ---"

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find src/out -type d -name "krkrsdl3.app" -not -path "*/build/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::krkrsdl3.app not found"
            find src/out -type d | head -60
            exit 1
          fi
          echo "APP=$APP"
          ls -la "$APP"
          echo "--- Info.plist (before) ---"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" 2>/dev/null | head -30 || true
          # 补齐 iOS 必需、但 CMake 没写进最终 plist 的键。
          # krkrsdl3_build 只把 bundle id 设成 Xcode target 的构建设置，最终 plist 里
          # 连 CFBundleIdentifier 都没有 -> Sideloadly 报 "Install failed: 'CFBundleIdentifier'"。
          python3 - "$APP/Info.plist" <<'PYEOF'
          import plistlib, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              pl = plistlib.load(f)
          added = []
          for k, v in [
              ("CFBundleIdentifier", "org.tvp.krkrsdl3"),
              ("CFBundleName", "krkrsdl3"),
              ("CFBundleVersion", "1"),
              ("CFBundleShortVersionString", "0.0.6"),
              ("UISupportedInterfaceOrientations",
               ["UIInterfaceOrientationPortrait",
                "UIInterfaceOrientationLandscapeLeft",
                "UIInterfaceOrientationLandscapeRight"]),
              # 让 app 的 Documents 出现在「文件」App -> 我的 iPhone -> krkrsdl3，
              # 这样不需要连电脑就能取出 krkr-ios.log（崩溃诊断用）。
              ("UIFileSharingEnabled", True),
              ("LSSupportsOpeningDocumentsInPlace", True),
          ]:
              if not pl.get(k):
                  pl[k] = v
                  added.append(k)
          with open(p, "wb") as f:
              plistlib.dump(pl, f, fmt=plistlib.FMT_BINARY)
          print("plist fixed:", ", ".join(added) if added else "(already complete)")
          PYEOF
          echo "--- Info.plist (after) ---"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" 2>/dev/null | grep -E "CFBundleIdentifier|CFBundleName|CFBundleVersion|UISupportedInterfaceOrientations" || true
          rm -rf Payload krkrsdl3-device.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 预留 game/ 目录：本地注入数据时直接放进去
          mkdir -p "Payload/krkrsdl3.app/game"
          zip -qry krkrsdl3-device.ipa Payload
          ls -la krkrsdl3-device.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: krkrsdl3-ios-ipa
          path: krkrsdl3-device.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-build-${{ github.run_number }}" krkrsdl3-device.ipa \
            --title "krkrsdl3 iOS build #${{ github.run_number }}" \
            --notes "Unsigned iOS device ipa (patched to load game from bundle/game)." || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/configure.log
            /tmp/build.log
            src/out/**/*.log
            src/vcpkg-manifest-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump logs into the job output on failure
        if: failure()
        run: |
          echo "========== CONFIGURE LOG (tail 200) =========="
          tail -200 /tmp/configure.log 2>/dev/null || echo "(no configure log)"
          echo "========== BUILD LOG (tail 400) =========="
          tail -400 /tmp/build.log 2>/dev/null || echo "(no build log)"
